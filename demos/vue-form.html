<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Vue 表单示例</title><style>body{font:15px system-ui;padding:20px}input,select,textarea,button{font:inherit}</style><div id="app">
  <div id="root">
    <form @submit.prevent="demo">
      账号：<input type="text" v-model.trim="userInfo.account" /> <br /><br />
      密码：<input type="password" v-model="userInfo.password" /> <br /><br />
      年龄：<input type="number" v-model.number="userInfo.age" /> <br /><br />
      性别： 男<input type="radio" name="sex" v-model="userInfo.sex" value="male" /> 女<input type="radio" name="sex" v-model="userInfo.sex" value="female" /> <br /><br />
      爱好： 学习<input type="checkbox" v-model="userInfo.hobby" value="study" /> 打游戏<input type="checkbox" v-model="userInfo.hobby" value="game" /> 吃饭<input
        type="checkbox"
        v-model="userInfo.hobby"
        value="eat" />
      <br /><br />
      所属校区
      <select v-model="userInfo.city">
        <option value="">请选择校区</option>
        <option value="beijing">北京</option>
        <option value="shanghai">上海</option>
        <option value="shenzhen">深圳</option>
        <option value="wuhan">成都</option>
      </select>
      <br /><br />
      其他信息：
      <textarea v-model.lazy="userInfo.other"></textarea> <br /><br />
      <input type="checkbox" v-model="userInfo.agree" />阅读并接受 <a href="https://www.yuque.com/cessstudy">《用户协议》</a><br /><br />
      <button>提交</button>
    </form>
  </div>
</div><script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script><script>const component={
    data() {
      return {
        userInfo: {
          account: '',
          password: '',
          age: 18,
          sex: 'female',
          hobby: [],
          city: 'beijing',
          other: '',
          agree: ''
        }
      };
    },
    methods: {
      demo() {
        console.log(JSON.stringify(this.userInfo));
        alert(JSON.stringify(this.userInfo));
      }
    }
  };Vue.createApp(component).mount("#app");</script></html>
